[project]
name = "cortes"
version = "0.1.0"
description = "CLI para garimpar, ranquear (via Claude Code/Codex) e cortar Shorts de podcasts"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2025.10.0",
    "faster-whisper>=1.1.0",
]

[project.scripts]
cortes = "cortes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortes"]
